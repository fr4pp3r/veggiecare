# ==================================================================
# VeggieCare configuration
# ==================================================================
# All values are validated by config/config.py before the application
# applies them. Edit this file, then restart VeggieCare.

system:
  name: VeggieCare
  # Run with simulated hardware (no GPIO/serial/SPI). Use for development
  # and testing on a PC. MUST be false on the Raspberry Pi.
  simulate_hardware: false
  timezone: Asia/Manila

database:
  # Paths are resolved relative to the project root when relative.
  path: data/veggiecare.db

logging:
  level: INFO          # DEBUG | INFO | WARNING | ERROR
  file: logs/veggiecare.log

# ------------------------------------------------------------------
# NPK sensor (RS485 Modbus RTU - JXCT JXBS-3001 7-in-1 soil sensor)
# ------------------------------------------------------------------
npk:
  enabled: true
  port: /dev/ttyUSB0
  slave_id: 1
  baudrate: 4800
  timeout: 1.0
  # Modbus holding registers: 0=Nitrogen, 1=Phosphorus, 2=Potassium
  register_start: 0
  register_count: 3
  # Multiply raw register values by this factor.
  # JXBS-3001 returns mg/kg directly, so the default is 1.0
  scale: 1.0
  # How often to read the sensor (updates the dashboard value)
  read_interval_seconds: 300
  # How often to persist a reading to the SQLite database
  log_interval_seconds: 900
  thresholds:
    nitrogen: 20         # mg/kg, configurable
    phosphorus: 20       # mg/kg, configurable
    potassium: 20        # mg/kg, configurable
  # Values returned when system.simulate_hardware is true
  simulated:
    nitrogen: 25
    phosphorus: 15
    potassium: 30

# ------------------------------------------------------------------
# Soil moisture sensor (MCP3008 ADC over SPI)
# ------------------------------------------------------------------
soil_moisture:
  enabled: true
  spi_bus: 0
  spi_device: 0          # CE0
  channel: 0             # moisture probe on CH0
  adc_max: 1023
  vref: 3.3
  dry_adc: 500           # calibration: ADC reading in dry air
  wet_adc: 50            # calibration: ADC reading in water
  samples: 20            # readings averaged per measurement
  read_interval_seconds: 5            # fast enough that a fresh reading lands
                                      # inside the 10 s cooldown/response window
  log_interval_seconds: 300
  # Relay 2 (watering) is activated automatically when moisture drops
  # below this percentage. There is NO monthly limit on watering.
  threshold: 30          # percent
  relay_id: 2
  # Closed-loop watering policy: after each watering the system watches
  # how the soil moisture responds before deciding to water again.
  hysteresis: 5                        # percent. Once "below threshold" is true it
                                       # stays true until moisture reaches
                                       # threshold + hysteresis. Stops a reading
                                       # oscillating around the threshold from
                                       # re-triggering. Must satisfy 0 <= hysteresis.
  # Wait this long after a completed watering before the system may
  # activate watering again (avoids re-triggering on a still-wet probe).
  # This window is also the period during which the moisture response is
  # observed to decide whether the watering worked.
  watering_cooldown_seconds: 10        # Short cooldown (10 s). This window is BOTH
                                       # the settling period after watering AND the
                                       # window during which the response is observed.
  response_rise_percent: 2.0           # percent rise in moisture required, within the
                                       # cooldown window, to count as "the watering worked".
  max_consecutive_non_responses: 3     # consecutive waterings with no measurable
                                       # response before the system declares a fault.
  max_watering_seconds_per_day: 1800    # hard ceiling on cumulative watering seconds per
                                       # calendar day (1800 = 30 min/day).
  # Value returned when system.simulate_hardware is true
  simulated:
    moisture: 45

# ------------------------------------------------------------------
# Relays - gpiozero LED abstraction
# ------------------------------------------------------------------
relays:
  # true if the relay module energizes on a HIGH GPIO signal,
  # false for active-low modules.
  active_high: false
  # Hard failsafe: any relay is force-turned OFF after this many seconds
  # even if nothing else stops it. Never 0.
  auto_off_watchdog_seconds: 180
  # How often (seconds) the watchdog thread checks deadlines.
  watchdog_check_seconds: 1.0
  # Duration used for manual activation from the dashboard when the
  # caller does not specify one.
  default_duration_seconds: 60
  items:
    - id: 1
      name: fertilizer
      label: NPK/Fertilizer
      pin: 17
      activation_duration_seconds: 120
    - id: 2
      name: watering
      label: Soil Moisture/Watering
      pin: 27
      activation_duration_seconds: 120
    - id: 3
      name: pest_response
      label: Pest Response
      pin: 22
      activation_duration_seconds: 120

# ------------------------------------------------------------------
# Pest detection. `detector: mock` fakes results and needs no model;
# `yolov11n` runs real inference (CPU-only torch, ~seconds per frame on
# a Pi 5). Switch back to mock to disable AI without uninstalling it.
# ------------------------------------------------------------------
pest_detection:
  enabled: true
  relay_id: 3
  detector: yolov11n

  # Optional explicit checkpoint, used when the trained run above is
  # absent. Relative paths resolve against the repo root. Leave blank and
  # the stock yolo11n-cls.pt weights are downloaded on first use.
  model_path:

  confidence_threshold: 0.70
  # Automated pest monitor: every capture_interval_seconds the stepper drives
  # the camera out and back (see `stepper` below) while the AI analyses frames.
  # 600 = every 10 minutes.
  capture_interval_seconds: 600
  # AI analysis cadence (seconds) while the camera is moving during a sweep.
  analysis_interval_seconds: 1.0
  relay_activation_duration_seconds: 120
  # The monthly activation limit applies ONLY to the pest response relay.
  # NPK alerts and soil-moisture watering are never limited.
  max_activations_per_month: 2
  # Pest classes are determined by the model's training data — the AI
  # reports whatever pest category it detects. No user configuration needed.
  mock:
    # none       -> never detects anything
    # random     -> random detections using the settings below
    # sequential -> cycles through `sequence` (deterministic, used by tests)
    mode: random
    sequence:
      - [aphid, 0.91, true]
      - [none, 0.0, false]
    random:
      detection_probability: 0.25
      confidence_min: 0.50
      confidence_max: 0.98

  # IPM-first treatment guidance surfaced when a pest is detected.
  suggestions:
    enabled: true
    disclaimer: "Treatment guidance only, not a prescription: always follow the product label and local regulations."
    fallback:
      title: "Pest not in local guide"
      summary: "The detected class is not in the local treatment knowledge base. Confirm the identification before acting."
      cultural:
        - "Remove visibly infested plant material and weeds; improve airflow and spacing."
        - "Scout and monitor regularly so action targets only confirmed pests."
      organic:
        - "Consider organic controls (e.g. insecticidal soap or neem) only after confirming the pest and reading the label."
      chemical:
        - "If needed, use a product registered for this pest on this crop and follow the label."
      notes:
        - "Always follow the product label, check pre-harvest intervals, and protect pollinators by spraying at dusk."

  treatments:
    - id: aphids
      names: [aphids, aphid]
      title: "Aphids"
      severity: high
      summary: "Soft-bodied sap suckers on new growth that curl leaves and leave honeydew; can spread viruses."
      cultural:
        - "Blast colonies off with a strong water spray early in the day."
        - "Remove infested tips and avoid excess nitrogen fertilizer."
        - "Encourage natural enemies such as lady beetles and lacewings."
      organic:
        - "Apply insecticidal soap or a neem/pyrethrin product labelled for aphids."
        - "Introduce beneficial insects such as lady beetles or parasitic wasps."
      chemical:
        - "Last resort: a pyrethrin- or pyrethroid-based product, or a registered systemic, for this pest on the crop."
      notes:
        - "Follow the product label and re-entry intervals."
        - "Check pre-harvest intervals before using on edible crops."
        - "Spray at dusk to protect pollinators and avoid blooms."
    - id: armyworm
      names: [armyworm]
      title: "Armyworm"
      severity: high
      summary: "Caterpillars that chew leaves and can strip young plants overnight."
      cultural:
        - "Hand-pick caterpillars and egg masses; destroy crop residues after harvest."
        - "Use pheromone traps to monitor adult flights and time interventions."
        - "Encourage birds and parasitic wasps by maintaining habitat."
      organic:
        - "Apply Bacillus thuringiensis (Bt) or spinosad products labelled for caterpillars."
        - "Use neem-based sprays for small larvae."
      chemical:
        - "Last resort: a registered carbamate, organophosphate, or pyrethroid product labelled for armyworm."
      notes:
        - "Follow the product label and re-entry intervals."
        - "Check pre-harvest intervals before using on edible crops."
        - "Spray at dusk to protect pollinators and avoid blooms."
    - id: beetle
      names: [beetle, weevil]
      title: "Beetles and weevils"
      severity: moderate
      summary: "Chewing beetles and weevils that defoliate plants and bore into stems."
      cultural:
        - "Hand-pick adults and larvae; use row covers on young plants."
        - "Rotate crops and remove plant debris to break life cycles."
        - "Use trap crops to concentrate beetles away from main crop."
      organic:
        - "Apply neem or pyrethrin products labelled for beetles."
        - "Use beneficial nematodes against soil-dwelling larvae."
      chemical:
        - "Last resort: a registered pyrethroid or carbaryl product labelled for beetles."
      notes:
        - "Follow the product label and re-entry intervals."
        - "Check pre-harvest intervals before using on edible crops."
        - "Spray at dusk to protect pollinators and avoid blooms."
    - id: bollworm
      names: [bollworm]
      title: "Bollworm"
      severity: high
      summary: "Larvae that bore into fruiting bodies, causing rot and yield loss."
      cultural:
        - "Remove and destroy damaged fruit and plant residues."
        - "Use pheromone traps to time scouting and treatment."
        - "Encourage parasitic wasps and predatory bugs."
      organic:
        - "Apply Bt or spinosad products labelled for bollworm."
        - "Use neem sprays on small larvae."
      chemical:
        - "Last resort: a registered pyrethroid or diamide product labelled for bollworm."
      notes:
        - "Follow the product label and re-entry intervals."
        - "Check pre-harvest intervals before using on edible crops."
        - "Spray at dusk to protect pollinators and avoid blooms."
    - id: grasshopper
      names: [grasshopper]
      title: "Grasshopper"
      severity: moderate
      summary: "Leaf- and stem-chewing insects that cause ragged defoliation."
      cultural:
        - "Maintain borders of short grass to reduce egg-laying habitat."
        - "Hand-pick in small gardens; use row covers on seedlings."
        - "Encourage birds and blister beetles as natural enemies."
      organic:
        - "Apply neem or garlic-based repellent sprays labelled for grasshoppers."
        - "Use Nosema locustae baits in small areas."
      chemical:
        - "Last resort: a registered carbaryl or pyrethroid product labelled for grasshoppers."
      notes:
        - "Follow the product label and re-entry intervals."
        - "Check pre-harvest intervals before using on edible crops."
        - "Spray at dusk to protect pollinators and avoid blooms."
    - id: mites
      names: [mites, mite]
      title: "Mites"
      severity: high
      summary: "Tiny sap suckers causing stippling, bronzing and webbing under leaves."
      cultural:
        - "Increase humidity and rinse foliage to dislodge mites."
        - "Remove heavily infested leaves and avoid drought stress."
        - "Avoid broad-spectrum insecticides that kill predatory mites."
      organic:
        - "Apply insecticidal soap or horticultural oil labelled for mites."
        - "Introduce predatory mites such as Phytoseiulus persimilis."
      chemical:
        - "Last resort: a registered miticide or abamectin product labelled for mites."
      notes:
        - "Follow the product label and re-entry intervals."
        - "Check pre-harvest intervals before using on edible crops."
        - "Spray at dusk to protect pollinators and avoid blooms."
    - id: mosquito
      names: [mosquito]
      title: "Mosquito"
      severity: low
      summary: "Nuisance adults breed in standing water; rarely direct plant pests."
      cultural:
        - "Eliminate standing water in trays, gutters and containers."
        - "Improve drainage and cover water storage."
        - "Use fans or screens in enclosed growing areas."
      organic:
        - "Use Bti products in standing water where label allows."
        - "Apply repellent sprays to people, not plants."
      chemical:
        - "Last resort: a registered larvicide or adulticide for mosquito control per local rules."
      notes:
        - "Follow the product label and re-entry intervals."
        - "Check pre-harvest intervals before using on edible crops."
        - "Protect pollinators: avoid broad spraying of flowering plants."
    - id: sawfly
      names: [sawfly]
      title: "Sawfly"
      severity: moderate
      summary: "Larvae that skeletonize leaves and can defoliate shrubs and crops."
      cultural:
        - "Hand-pick larvae early in the season."
        - "Remove and destroy infested foliage and debris."
        - "Encourage parasitic wasps."
      organic:
        - "Apply insecticidal soap or spinosad products labelled for sawfly."
        - "Use neem sprays on young larvae."
      chemical:
        - "Last resort: a registered carbaryl or pyrethroid product labelled for sawfly."
      notes:
        - "Follow the product label and re-entry intervals."
        - "Check pre-harvest intervals before using on edible crops."
        - "Spray at dusk to protect pollinators and avoid blooms."
    - id: stem_borer
      names: [stem_borer]
      title: "Stem borer"
      severity: high
      summary: "Larvae tunnel in stems causing wilting, dead hearts and broken stalks."
      cultural:
        - "Remove and destroy infested stems and stubble after harvest."
        - "Use pheromone traps to monitor moth activity."
        - "Adjust planting dates to avoid peak flights."
      organic:
        - "Apply Bt or neem products labelled for borers where contact is possible."
        - "Release egg parasitoids suited to the species."
      chemical:
        - "Last resort: a registered systemic or granular insecticide labelled for stem borers."
      notes:
        - "Follow the product label and re-entry intervals."
        - "Check pre-harvest intervals before using on edible crops."
        - "Spray at dusk to protect pollinators and avoid blooms."
    - id: caterpillar
      names: [caterpillar]
      title: "Caterpillar (general)"
      severity: moderate
      summary: "Chewing larvae causing holes in leaves and fruit."
      cultural:
        - "Hand-pick and destroy larvae and egg masses."
        - "Use row covers and remove weeds that host larvae."
        - "Encourage birds and predatory insects."
      organic:
        - "Apply Bt or spinosad products labelled for caterpillars."
        - "Use neem sprays on young larvae."
      chemical:
        - "Last resort: a registered pyrethroid or carbamate product labelled for caterpillars."
      notes:
        - "Follow the product label and re-entry intervals."
        - "Check pre-harvest intervals before using on edible crops."
        - "Spray at dusk to protect pollinators and avoid blooms."
    - id: fungus
      names: [fungus]
      title: "Fungal disease"
      severity: moderate
      summary: "Fungal infection (not an insect) causing spots, mould or rot on leaves and stems."
      cultural:
        - "Improve airflow, spacing and watering at the base; avoid wet foliage."
        - "Remove and destroy infected plant material; sanitize tools."
        - "Rotate crops and use resistant varieties where available."
      organic:
        - "Apply copper or sulfur fungicides labelled for the disease."
        - "Use biological fungicides such as Bacillus subtilis where labelled."
      chemical:
        - "Last resort: a registered systemic or protectant fungicide labelled for this disease."
      notes:
        - "Follow the product label and re-entry intervals."
        - "Check pre-harvest intervals before using on edible crops."
        - "Protect pollinators and avoid spraying blooms where possible."
    - id: whitefly
      names: [whitefly]
      title: "Whitefly"
      severity: moderate
      summary: "Small white sap suckers under leaves causing yellowing and sooty mould."
      cultural:
        - "Use yellow sticky traps to monitor and reduce adults."
        - "Remove infested leaves; avoid excess nitrogen."
        - "Encourage parasitic wasps and predatory beetles."
      organic:
        - "Apply insecticidal soap or neem products labelled for whitefly."
        - "Release Encarsia or Eretmocerus parasitoids."
      chemical:
        - "Last resort: a registered pyrethrin, pyrethroid or IGR product labelled for whitefly."
      notes:
        - "Follow the product label and re-entry intervals."
        - "Check pre-harvest intervals before using on edible crops."
        - "Spray at dusk to protect pollinators and avoid blooms."
    - id: slugs_snails
      names: [slug, snail]
      title: "Slugs and snails"
      severity: moderate
      summary: "Molluscs that rasp holes in leaves and seedlings, feeding at night."
      cultural:
        - "Remove hiding spots; hand-pick at night or early morning."
        - "Use barriers such as copper tape or diatomaceous earth."
        - "Reduce mulch contact with stems and improve drainage."
      organic:
        - "Use iron phosphate slug baits labelled for the crop."
        - "Set beer traps or board traps and empty daily."
      chemical:
        - "Last resort: a registered metaldehyde or iron phosphate molluscicide labelled for the crop."
      notes:
        - "Follow the product label and re-entry intervals."
        - "Check pre-harvest intervals before using on edible crops."
        - "Avoid harm to pets, wildlife and beneficials; follow label."
    - id: thrips
      names: [thrips]
      title: "Thrips"
      severity: moderate
      summary: "Tiny rasping insects causing silvering, stippling and distorted growth."
      cultural:
        - "Use blue sticky traps to monitor adults."
        - "Remove weeds and crop debris that harbour thrips."
        - "Avoid excess nitrogen and water stress."
      organic:
        - "Apply insecticidal soap or spinosad products labelled for thrips."
        - "Use predatory mites and minute pirate bugs."
      chemical:
        - "Last resort: a registered spinosad, pyrethrin or carbamate product labelled for thrips."
      notes:
        - "Follow the product label and re-entry intervals."
        - "Check pre-harvest intervals before using on edible crops."
        - "Spray at dusk to protect pollinators and avoid blooms."

# ------------------------------------------------------------------
# NPK-based fertilizer recommendations.
# Generates fertilizer suggestions from soil NPK readings.
# Uses a rule-based engine (zero ML, negligible RAM) by default.
# ML engines: 'sklearn' (joblib), 'onnx' (ONNX Runtime)
# ------------------------------------------------------------------
npk_recommendations:
  enabled: true
  # Engine: rule_engine | sklearn | onnx | mock
  engine: onnx
  # Model path for ML engines (relative to repo root)
  model_path: models/fertilizer_rf.onnx
  # Crop type determines target NPK ranges. Options: tomato, pepper, lettuce, cucumber, custom
  crop_type: tomato
  # Growth stage: seedling, vegetative, flowering, fruiting
  growth_stage: vegetative
  # Target NPK ranges per crop and stage (mg/kg). Adjust for your specific varieties.
  targets:
    tomato:
      seedling:
        nitrogen: [50, 80]
        phosphorus: [30, 50]
        potassium: [40, 70]
      vegetative:
        nitrogen: [100, 150]
        phosphorus: [40, 60]
        potassium: [80, 120]
      flowering:
        nitrogen: [80, 120]
        phosphorus: [50, 80]
        potassium: [100, 150]
      fruiting:
        nitrogen: [60, 100]
        phosphorus: [40, 70]
        potassium: [120, 180]
    pepper:
      seedling:
        nitrogen: [40, 70]
        phosphorus: [30, 50]
        potassium: [40, 70]
      vegetative:
        nitrogen: [80, 120]
        phosphorus: [40, 60]
        potassium: [80, 120]
      flowering:
        nitrogen: [60, 100]
        phosphorus: [50, 80]
        potassium: [100, 150]
      fruiting:
        nitrogen: [50, 90]
        phosphorus: [40, 70]
        potassium: [120, 180]
    lettuce:
      seedling:
        nitrogen: [60, 100]
        phosphorus: [30, 50]
        potassium: [50, 80]
      vegetative:
        nitrogen: [120, 180]
        phosphorus: [40, 70]
        potassium: [80, 120]
      flowering:
        nitrogen: [80, 130]
        phosphorus: [40, 60]
        potassium: [100, 140]
      fruiting:
        nitrogen: [60, 100]
        phosphorus: [30, 50]
        potassium: [80, 120]
    cucumber:
      seedling:
        nitrogen: [50, 80]
        phosphorus: [40, 60]
        potassium: [60, 90]
      vegetative:
        nitrogen: [100, 150]
        phosphorus: [50, 80]
        potassium: [100, 150]
      flowering:
        nitrogen: [80, 120]
        phosphorus: [60, 90]
        potassium: [120, 180]
      fruiting:
        nitrogen: [60, 100]
        phosphorus: [50, 80]
        potassium: [150, 220]

  # Fertilizer recipes available to the recommender.
  # Each recipe: id, name, n_p_k (ratio percentages), dosage_g_per_10L, suitable_for (stages)
  fertilizers:
    - id: balanced_20_20_20
      name: "Balanced 20-20-20"
      n_p_k: [20, 20, 20]
      dosage_g_per_10L: 10
      suitable_for: ["seedling", "vegetative", "flowering", "fruiting"]
    - id: high_n_30_10_10
      name: "High Nitrogen 30-10-10"
      n_p_k: [30, 10, 10]
      dosage_g_per_10L: 5
      suitable_for: ["vegetative"]
    - id: high_p_10_30_10
      name: "High Phosphorus 10-30-10"
      n_p_k: [10, 30, 10]
      dosage_g_per_10L: 6
      suitable_for: ["seedling", "flowering"]
    - id: high_k_10_10_30
      name: "High Potassium 10-10-30"
      n_p_k: [10, 10, 30]
      dosage_g_per_10L: 8
      suitable_for: ["flowering", "fruiting"]
    - id: tomato_feed_4_6_8
      name: "Tomato Feed 4-6-8"
      n_p_k: [4, 6, 8]
      dosage_g_per_10L: 20
      suitable_for: ["flowering", "fruiting"]

  # Mock settings for testing (when detector is set to mock)
  mock:
    # none       -> never recommends anything
    # random     -> random recommendations using settings below
    # sequential -> cycles through `sequence` (deterministic, used by tests)
    mode: random
    sequence:
      - [true, "balanced_20_20_20", 10.0, "medium"]
      - [false, null, null, null]
    recommend_probability: 0.5

# ------------------------------------------------------------------
# Camera - USB webcam.
#
# A webcam is a V4L2 video device: /dev/video0, /dev/video1, ...
# It is NEVER /dev/ttyUSB0 — that is the NPK sensor's RS485/FTDI
# serial adapter (see the npk section above).
#
# device_path accepts three things:
#   auto       probe every /dev/video* node and use the first that
#              actually delivers frames (recommended; see below)
#   /dev/videoN  pin one specific node
#   ''         fall back to device_index
#
# Prefer 'auto' on a Pi 5: the libcamera/pipewire stack registers many
# nodes (video19-video35 and friends) that open successfully but are
# metadata-only and never produce an image, so guessing a fixed index
# or path is unreliable. To pin a node instead, use "Find my camera" on
# the /camera page and copy the node it reports.
# ------------------------------------------------------------------
camera:
  enabled: true
  type: usb  # use USB webcam
  device_path: auto        # 'auto', '/dev/videoN', or '' for device_index
  device_index: 0            # fallback when device_path is empty
  width: 640                 # requested; the driver may ignore this
  height: 480
  fps: 15
  capture_interval_seconds: 300
  image_dir: data/images
# ------------------------------------------------------------------
# Stepper motor (camera movement)
# ------------------------------------------------------------------
stepper:
  enabled: true
  pins: [23, 24, 25, 26]
  steps_per_plant: 512  # ~90 degrees
  delay: 0.003
  simulate: false
  # Camera-sweep geometry. A motor step count is derived from these:
  #   steps = extension_distance_in / (pi * wheel_diameter_in) * steps_per_rev
  # Default: 2-1/8 in wheel, 3 ft extension, 2048 steps/rev (~11,000 steps).
  wheel_diameter_in: 2.125
  extension_distance_in: 36.0
  steps_per_rev: 2048
